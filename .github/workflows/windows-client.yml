name: Windows client

on:
  push:
    paths: ['viewer/**', 'tests/**', 'tools/build_windows.ps1', '.github/workflows/windows-client.yml']
  pull_request:
    paths: ['viewer/**', 'tests/**', 'tools/build_windows.ps1', '.github/workflows/windows-client.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r viewer/requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Exercise the desktop UI and input
        run: python -m unittest discover -s tests -p gui_smoke.py -v
      - name: Build standalone Windows client
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name MintREMOTE --paths viewer viewer/mintremote_viewer.py
      - name: Check packaged app starts
        shell: pwsh
        run: |
          $client = Start-Process -FilePath dist/MintREMOTE.exe -PassThru
          Start-Sleep -Seconds 8
          if ($client.HasExited) { throw "Client exited unexpectedly: $($client.ExitCode)" }
          Stop-Process -Id $client.Id
      - uses: actions/upload-artifact@v4
        with:
          name: MintREMOTE-Windows-x64
          path: |
            dist/MintREMOTE.exe
            docs/WINDOWS_CLIENT.md
            LICENSE
          if-no-files-found: error
